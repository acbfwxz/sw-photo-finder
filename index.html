<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SW Photo Finder</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 450px;
            margin: auto;
            padding: 25px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-top: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        .secondary {
            background: #777;
            margin-top: 10px;
        }

        .link {
            text-align: center;
            margin-top: 18px;
            color: #3367d6;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            color: #d33;
        }

        .success {
            color: green;
        }

        .search-box {
            margin-top: 25px;
        }

        .logout {
            margin-top: 20px;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- LOGIN -->

    <div id="loginPage" class="box">

        <h1>🏫 SW Photo Finder</h1>

        <p class="subtitle">
            เข้าสู่ระบบเพื่อค้นหารูปกิจกรรม
        </p>


        <input
            type="text"
            id="loginUsername"
            placeholder="ชื่อผู้ใช้"
            autocomplete="username"
        >


        <input
            type="password"
            id="loginPassword"
            placeholder="รหัสผ่าน"
            autocomplete="current-password"
        >


        <button id="loginButton">
            🔐 เข้าสู่ระบบ
        </button>


        <p
            class="link"
            id="goRegister"
        >
            ยังไม่มีบัญชี? สมัครสมาชิก
        </p>


        <p
            id="loginMessage"
            class="message"
        ></p>

    </div>



    <!-- REGISTER -->

    <div
        id="registerPage"
        class="box hidden"
    >

        <h1>📝 สมัครสมาชิก</h1>

        <p class="subtitle">
            สร้างบัญชี SW Photo Finder
        </p>


        <input
            type="text"
            id="registerUsername"
            placeholder="ชื่อผู้ใช้"
            autocomplete="username"
        >


        <input
            type="password"
            id="registerPassword"
            placeholder="รหัสผ่าน"
            autocomplete="new-password"
        >


        <input
            type="password"
            id="registerConfirm"
            placeholder="ยืนยันรหัสผ่าน"
            autocomplete="new-password"
        >


        <button id="registerButton">
            📝 สมัครสมาชิก
        </button>


        <button
            class="secondary"
            id="goLogin"
        >
            กลับไปเข้าสู่ระบบ
        </button>


        <p
            id="registerMessage"
            class="message"
        ></p>

    </div>



    <!-- MAIN -->

    <div
        id="mainPage"
        class="box hidden"
    >

        <h1>🏫 SW Photo Finder</h1>

        <p class="subtitle">
            ค้นหารูปกิจกรรมโรงเรียน
        </p>


        <div class="search-box">

            <input
                type="text"
                id="search"
                placeholder="เช่น กีฬาสี 2569"
            >


            <button id="searchButton">
                🔎 ค้นหา
            </button>

        </div>


        <div id="results"></div>


        <button
            class="secondary logout"
            id="logoutButton"
        >
            🚪 ออกจากระบบ
        </button>

    </div>


</div>



<!-- Firebase -->

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    // -------------------------
    // Firebase Config
    // -------------------------

    const firebaseConfig = {

        apiKey: "AIzaSyBnXa3xAHIfIKLlYku8gH9nl8CXZ6I3QzA",

        authDomain: "sw-photo-finder.firebaseapp.com",

        projectId: "sw-photo-finder",

        storageBucket: "sw-photo-finder.firebasestorage.app",

        messagingSenderId: "247908189079",

        appId: "1:247908189079:web:a8db298bad5c43cf717ad2",

        measurementId: "G-RZJ44RSQXS"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);



    // -------------------------
    // แปลง Username เป็น Email
    // -------------------------

    function usernameToEmail(username) {

        return username.toLowerCase()
            + "@swphotofinder.local";

    }



    // -------------------------
    // แสดง Login
    // -------------------------

    function showLogin() {

        document
            .getElementById("loginPage")
            .classList.remove("hidden");

        document
            .getElementById("registerPage")
            .classList.add("hidden");

        document
            .getElementById("mainPage")
            .classList.add("hidden");

    }



    // -------------------------
    // แสดง Register
    // -------------------------

    function showRegister() {

        document
            .getElementById("loginPage")
            .classList.add("hidden");

        document
            .getElementById("registerPage")
            .classList.remove("hidden");

        document
            .getElementById("mainPage")
            .classList.add("hidden");

    }



    // -------------------------
    // แสดง Main
    // -------------------------

    function showMain() {

        document
            .getElementById("loginPage")
            .classList.add("hidden");

        document
            .getElementById("registerPage")
            .classList.add("hidden");

        document
            .getElementById("mainPage")
            .classList.remove("hidden");

    }



    // -------------------------
    // ไป Register
    // -------------------------

    document
        .getElementById("goRegister")
        .addEventListener("click", function () {

            showRegister();

            document
                .getElementById("loginMessage")
                .textContent = "";

        });



    // -------------------------
    // กลับ Login
    // -------------------------

    document
        .getElementById("goLogin")
        .addEventListener("click", function () {

            showLogin();

            document
                .getElementById("registerMessage")
                .textContent = "";

        });



    // -------------------------
    // สมัครสมาชิก
    // -------------------------

    document
        .getElementById("registerButton")
        .addEventListener("click", async function () {

            const username =
                document
                    .getElementById("registerUsername")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("registerPassword")
                    .value;


            const confirmPassword =
                document
                    .getElementById("registerConfirm")
                    .value;


            const message =
                document
                    .getElementById("registerMessage");


            message.className = "message";


            if (
                username === "" ||
                password === "" ||
                confirmPassword === ""
            ) {

                message.textContent =
                    "กรุณากรอกข้อมูลให้ครบ";

                return;

            }


            if (username.length < 3) {

                message.textContent =
                    "ชื่อผู้ใช้ต้องมีอย่างน้อย 3 ตัวอักษร";

                return;

            }


            if (username.length > 30) {

                message.textContent =
                    "ชื่อผู้ใช้ยาวเกินไป";

                return;

            }


            if (!/^[a-zA-Z0-9._-]+$/.test(username)) {

                message.textContent =
                    "ชื่อผู้ใช้ใช้ได้เฉพาะ A-Z, a-z, 0-9, . _ -";

                return;

            }


            if (password.length < 6) {

                message.textContent =
                    "รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร";

                return;

            }


            if (password !== confirmPassword) {

                message.textContent =
                    "รหัสผ่านไม่ตรงกัน";

                return;

            }


            const email =
                usernameToEmail(username);


            try {

                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                message.className =
                    "message success";


                message.textContent =
                    "สมัครสมาชิกสำเร็จ 🎉";


                document
                    .getElementById("registerUsername")
                    .value = "";

                document
                    .getElementById("registerPassword")
                    .value = "";

                document
                    .getElementById("registerConfirm")
                    .value = "";


            } catch (error) {

                console.error(error);


                if (
                    error.code ===
                    "auth/email-already-in-use"
                ) {

                    message.textContent =
                        "ชื่อผู้ใช้นี้มีอยู่แล้ว";

                } else {

                    message.textContent =
                        "สมัครสมาชิกไม่สำเร็จ: "
                        + error.message;

                }

            }

        });



    // -------------------------
    // Login
    // -------------------------

    document
        .getElementById("loginButton")
        .addEventListener("click", async function () {

            const username =
                document
                    .getElementById("loginUsername")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("loginPassword")
                    .value;


            const message =
                document
                    .getElementById("loginMessage");


            message.className =
                "message";


            if (
                username === "" ||
                password === ""
            ) {

                message.textContent =
                    "กรุณากรอกชื่อผู้ใช้และรหัสผ่าน";

                return;

            }


            const email =
                usernameToEmail(username);


            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                message.textContent = "";


            } catch (error) {

                console.error(error);


                message.textContent =
                    "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";

            }

        });



    // -------------------------
    // ตรวจสอบสถานะ Login
    // -------------------------

    onAuthStateChanged(auth, function (user) {

        if (user) {

            showMain();

        } else {

            showLogin();

        }

    });



    // -------------------------
    // ค้นหากิจกรรม
    // -------------------------

    document
        .getElementById("searchButton")
        .addEventListener("click", function () {

            const keyword =
                document
                    .getElementById("search")
                    .value
                    .trim();


            const results =
                document
                    .getElementById("results");


            if (keyword === "") {

                results.innerHTML =
                    "<p>กรุณาพิมพ์ชื่อกิจกรรม</p>";

                return;

            }


            results.innerHTML =
                "<p>🔎 กำลังค้นหา: <b>"
                + keyword
                + "</b></p>";

        });



    // -------------------------
    // Logout
    // -------------------------

    document
        .getElementById("logoutButton")
        .addEventListener("click", async function () {

            await signOut(auth);

        });

</script>


</body>

</html>
