<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SW Photo Finder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      width: 90%;
      max-width: 500px;
      margin: 50px auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #d1007f;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #d1007f;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .secondary {
      background: #777;
    }

    .link-btn {
      background: none;
      color: #d1007f;
      margin-top: 5px;
    }

    .error {
      color: red;
      text-align: center;
      margin-top: 10px;
    }

    .success {
      color: green;
      text-align: center;
      margin-top: 10px;
    }

    #mainPage {
      display: none;
    }

    #registerPage {
      display: none;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div class="container" id="loginPage">

    <h1>📸 SW Photo Finder</h1>

    <div class="subtitle">
      ค้นหารูปกิจกรรมโรงเรียน
    </div>

    <input
      type="text"
      id="loginUsername"
      placeholder="ชื่อผู้ใช้"
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="รหัสผ่าน"
    >

    <button id="loginBtn">
      เข้าสู่ระบบ
    </button>

    <button class="link-btn" id="showRegisterBtn">
      สมัครสมาชิก
    </button>

    <div class="error" id="loginError"></div>

  </div>


  <!-- REGISTER -->
  <div class="container" id="registerPage">

    <h1>📝 สมัครสมาชิก</h1>

    <input
      type="text"
      id="registerUsername"
      placeholder="ชื่อผู้ใช้"
    >

    <input
      type="password"
      id="registerPassword"
      placeholder="รหัสผ่าน"
    >

    <input
      type="password"
      id="registerConfirmPassword"
      placeholder="ยืนยันรหัสผ่าน"
    >

    <button id="registerBtn">
      สมัครสมาชิก
    </button>

    <button class="secondary" id="backLoginBtn">
      กลับไปเข้าสู่ระบบ
    </button>

    <div class="error" id="registerError"></div>

  </div>


  <!-- MAIN -->
  <div class="container" id="mainPage">

    <h1>📸 SW Photo Finder</h1>

    <div class="subtitle">
      ค้นหารูปกิจกรรมของโรงเรียน
    </div>

    <input
      type="text"
      id="searchInput"
      placeholder="เช่น กีฬาสี 2568"
    >

    <button id="searchBtn">
      🔎 ค้นหา
    </button>

    <div id="searchResult"></div>

    <button class="secondary" id="logoutBtn">
      ออกจากระบบ
    </button>

  </div>


  <!-- FIREBASE -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBnXa3xAHIfIKlLyku8g9Hnl8CXZ6I3QzA",
      authDomain: "sw-photo-finder.firebaseapp.com",
      projectId: "sw-photo-finder",
      storageBucket: "sw-photo-finder.firebasestorage.app",
      messagingSenderId: "247908189079",
      appId: "1:247908189079:web:a8db298bad5c43cf717ad2",
      measurementId: "G-RZJ44RSQXS"
    };


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    // ให้ Login ค้างไว้แม้ปิด Chrome
    const persistenceReady =
      setPersistence(auth, browserLocalPersistence);


    // แปลง username เป็น email ภายใน
    function usernameToEmail(username) {
      return username.trim().toLowerCase()
        + "@swphotofinder.local";
    }


    // หน้า
    const loginPage =
      document.getElementById("loginPage");

    const registerPage =
      document.getElementById("registerPage");

    const mainPage =
      document.getElementById("mainPage");


    // ปุ่มเปลี่ยนไปสมัครสมาชิก
    document.getElementById("showRegisterBtn")
      .addEventListener("click", () => {

        loginPage.style.display = "none";
        registerPage.style.display = "block";

      });


    // ปุ่มกลับหน้า Login
    document.getElementById("backLoginBtn")
      .addEventListener("click", () => {

        registerPage.style.display = "none";
        loginPage.style.display = "block";

      });


    // สมัครสมาชิก
    document.getElementById("registerBtn")
      .addEventListener("click", async () => {

        const username =
          document.getElementById("registerUsername")
            .value.trim();

        const password =
          document.getElementById("registerPassword")
            .value;

        const confirmPassword =
          document.getElementById("registerConfirmPassword")
            .value;

        const error =
          document.getElementById("registerError");


        error.textContent = "";


        if (!username || !password || !confirmPassword) {
          error.textContent =
            "กรุณากรอกข้อมูลให้ครบ";
          return;
        }


        if (password.length < 6) {
          error.textContent =
            "รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร";
          return;
        }


        if (password !== confirmPassword) {
          error.textContent =
            "รหัสผ่านไม่ตรงกัน";
          return;
        }


        try {

          await persistenceReady;

          await createUserWithEmailAndPassword(
            auth,
            usernameToEmail(username),
            password
          );

        } catch (err) {

          console.error(err);

          if (err.code === "auth/email-already-in-use") {
            error.textContent =
              "ชื่อผู้ใช้นี้ถูกใช้แล้ว";
          }
          else if (err.code === "auth/invalid-api-key") {
            error.textContent =
              "API Key ของ Firebase ไม่ถูกต้อง";
          }
          else {
            error.textContent =
              "สมัครสมาชิกไม่สำเร็จ: " + err.message;
          }

        }

      });


    // Login
    document.getElementById("loginBtn")
      .addEventListener("click", async () => {

        const username =
          document.getElementById("loginUsername")
            .value.trim();

        const password =
          document.getElementById("loginPassword")
            .value;

        const error =
          document.getElementById("loginError");


        error.textContent = "";


        if (!username || !password) {
          error.textContent =
            "กรุณากรอกชื่อผู้ใช้และรหัสผ่าน";
          return;
        }


        try {

          await persistenceReady;

          await signInWithEmailAndPassword(
            auth,
            usernameToEmail(username),
            password
          );

        } catch (err) {

          console.error(err);

          if (
            err.code === "auth/invalid-credential" ||
            err.code === "auth/wrong-password" ||
            err.code === "auth/user-not-found"
          ) {
            error.textContent =
              "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
          }
          else if (err.code === "auth/invalid-api-key") {
            error.textContent =
              "API Key ของ Firebase ไม่ถูกต้อง";
          }
          else {
            error.textContent =
              "เข้าสู่ระบบไม่สำเร็จ: " + err.message;
          }

        }

      });


    // Logout
    document.getElementById("logoutBtn")
      .addEventListener("click", async () => {

        await signOut(auth);

      });


    // ค้นหา
    document.getElementById("searchBtn")
      .addEventListener("click", () => {

        const keyword =
          document.getElementById("searchInput")
            .value.trim();

        const result =
          document.getElementById("searchResult");


        if (!keyword) {
          result.innerHTML =
            "<p>กรุณาพิมพ์สิ่งที่ต้องการค้นหา</p>";
          return;
        }


        result.innerHTML =
          "<p>🔎 กำลังค้นหา: " +
          keyword +
          "</p>";

      });


    // ตรวจสอบสถานะ Login
    onAuthStateChanged(auth, (user) => {

      if (user) {

        loginPage.style.display = "none";
        registerPage.style.display = "none";
        mainPage.style.display = "block";

      } else {

        loginPage.style.display = "block";
        registerPage.style.display = "none";
        mainPage.style.display = "none";

      }

    });

  </script>

</body>
</html>
